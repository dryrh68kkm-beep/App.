# Cloudflare Worker ของแอปรายรับรายจ่าย (ใช้กับ Workers Builds ที่ต่อกับ repo นี้ หรือ npx wrangler deploy)
# ชื่อโปรเจกต์ใน Cloudflare ต้องเป็น family-money ให้ตรงกับ name
name = "family-money"
main = "worker/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "family-money"
# ไม่ระบุ database_id: ตอน deploy Cloudflare จะสร้าง/ผูกฐานข้อมูลชื่อนี้ในบัญชีที่ deploy ให้เอง
# Worker สร้างตารางเองตอนใช้งานครั้งแรก (worker/worker.js → ensureSchema)

# รหัสครอบครัว: ตั้งเป็น Secret ชื่อ FAMILY_PASSWORD ใน Cloudflare (ห้ามเขียนรหัสในไฟล์นี้)
